<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap" style="background:var(--marigold-300);justify-content:center">
<div style="display:flex;align-items:center;gap:12px"><span style="flex:1;border-top:2px dotted var(--ochre-500);opacity:.7"></span>
<span style="width:14px;height:14px;border-radius:50%;background:var(--ochre-400)"></span>
<span style="width:10px;height:10px;border-radius:50%;background:var(--sky-300)"></span>
<span style="width:18px;height:18px;border-radius:50%;background:var(--clay-400)"></span>
<span style="width:10px;height:10px;border-radius:50%;background:var(--vermilion-400)"></span>
<span style="flex:1;border-top:2px dotted var(--ochre-500);opacity:.7"></span></div>
<div style="font:400 10px/1.6 var(--font-mono);color:var(--clay-500);text-align:center">Nodes: ochre · sky · clay · vermilion, on a 2px dotted path</div></div></body></html>
