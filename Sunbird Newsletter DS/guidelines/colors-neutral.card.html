<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap"><div class="row"><div class="sw" style="background:var(--ink-900);color:#fff">ink-900<small>#2B2B2B</small></div><div class="sw" style="background:var(--ink-700);color:#fff">ink-700<small>#434343</small></div><div class="sw" style="background:var(--ink-500);color:#fff">ink-500<small>#595959</small></div><div class="sw" style="background:var(--ink-300);color:#fff">ink-300<small>#8C8C8C</small></div><div class="sw" style="background:var(--paper-100);color:var(--ink-700)">paper-100<small>#F6F1EA</small></div><div class="sw" style="background:var(--paper-0);color:var(--ink-700)">paper-0<small>#FFFFFF</small></div></div></div></body></html>
