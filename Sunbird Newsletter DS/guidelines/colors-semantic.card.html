<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap"><div class="row" style="gap:14px">
<div style="flex:1;min-width:0"><div style="height:44px;border-radius:6px;background:var(--bg-page);border:1px solid var(--border-hairline)"></div><div style="font:600 11px/1.4 var(--font-display);margin-top:6px">Page ground</div><div style="font:400 10px/1.3 var(--font-mono);color:var(--text-muted)">--bg-page</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:6px;background:var(--surface-card);border:1px solid var(--border-hairline)"></div><div style="font:600 11px/1.4 var(--font-display);margin-top:6px">Card surface</div><div style="font:400 10px/1.3 var(--font-mono);color:var(--text-muted)">--surface-card</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:6px;background:var(--surface-inverse);border:1px solid var(--border-hairline)"></div><div style="font:600 11px/1.4 var(--font-display);margin-top:6px">Inverse panel</div><div style="font:400 10px/1.3 var(--font-mono);color:var(--text-muted)">--surface-inverse</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:6px;background:var(--text-display);border:1px solid var(--border-hairline)"></div><div style="font:600 11px/1.4 var(--font-display);margin-top:6px">Display text</div><div style="font:400 10px/1.3 var(--font-mono);color:var(--text-muted)">--text-display</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:6px;background:var(--accent-alert);border:1px solid var(--border-hairline)"></div><div style="font:600 11px/1.4 var(--font-display);margin-top:6px">Alert</div><div style="font:400 10px/1.3 var(--font-mono);color:var(--text-muted)">--accent-alert</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:6px;background:var(--border-hairline);border:1px solid var(--border-hairline)"></div><div style="font:600 11px/1.4 var(--font-display);margin-top:6px">Hairline</div><div style="font:400 10px/1.3 var(--font-mono);color:var(--text-muted)">--border-hairline</div></div>
</div></div></body></html>
