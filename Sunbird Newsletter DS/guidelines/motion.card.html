<!-- @dsCard group="Brand" viewport="700x160" name="Motion & states" subtitle="Hover darkens, press shrinks 2%" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap"><div class="row" style="align-items:center">
<span style="padding:12px 24px;border-radius:999px;background:var(--clay-400);color:#fff;font:600 14px/1 var(--font-display)">Default</span>
<span style="padding:12px 24px;border-radius:999px;background:var(--clay-500);color:#fff;font:600 14px/1 var(--font-display)">Hover</span>
<span style="padding:12px 24px;border-radius:999px;background:var(--clay-500);color:#fff;font:600 14px/1 var(--font-display);transform:scale(.98)">Press</span>
<span style="padding:12px 24px;border-radius:999px;background:var(--clay-400);color:#fff;font:600 14px/1 var(--font-display);box-shadow:var(--focus-ring)">Focus</span>
<span style="padding:12px 24px;border-radius:999px;background:var(--clay-400);color:#fff;font:600 14px/1 var(--font-display);opacity:.45">Disabled</span>
</div><div style="font:400 10px/1.6 var(--font-mono);color:var(--text-muted)">200ms · cubic-bezier(.2,.6,.25,1)</div></div></body></html>
