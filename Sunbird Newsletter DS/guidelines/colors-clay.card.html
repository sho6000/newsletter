<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap"><div class="row"><div class="sw" style="background:var(--clay-100);color:var(--clay-600)">clay-100<small>#F3D9D0</small></div><div class="sw" style="background:var(--clay-200);color:var(--clay-600)">clay-200<small>#E0A992</small></div><div class="sw" style="background:var(--clay-300);color:#fff">clay-300<small>#C87B5C</small></div><div class="sw" style="background:var(--clay-400);color:#fff">clay-400<small>#A85236</small></div><div class="sw" style="background:var(--clay-500);color:#fff">clay-500<small>#8A3F27</small></div><div class="sw" style="background:var(--clay-600);color:#fff">clay-600<small>#6A2F1C</small></div></div></div></body></html>
