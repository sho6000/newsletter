<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap"><div class="row"><div class="sw" style="background:var(--sky-100);color:var(--sky-500)">sky-100<small>#E2EFF3</small></div><div class="sw" style="background:var(--sky-200);color:var(--sky-500)">sky-200<small>#BCDAE2</small></div><div class="sw" style="background:var(--sky-300);color:#fff">sky-300<small>#70AEC0</small></div><div class="sw" style="background:var(--sky-400);color:#fff">sky-400<small>#4C8B9D</small></div><div class="sw" style="background:var(--ochre-300);color:#fff">ochre-300<small>#DAA26A</small></div><div class="sw" style="background:var(--ochre-400);color:#fff">ochre-400<small>#CC8546</small></div></div></div></body></html>
