<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--paper-0);color:var(--text-body)}*{box-sizing:border-box}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px;font:600 11px/1.3 var(--font-display)}.sw small{display:block;font:400 10px/1.3 var(--font-mono);opacity:.75}</style></head><body><div class="wrap"><div class="row"><div class="sw" style="background:var(--marigold-50);color:var(--clay-500)">marigold-50<small>#FFFAEA</small></div><div class="sw" style="background:var(--marigold-100);color:var(--clay-500)">marigold-100<small>#FFF3CD</small></div><div class="sw" style="background:var(--marigold-200);color:var(--clay-500)">marigold-200<small>#FFE9A6</small></div><div class="sw" style="background:var(--marigold-300);color:var(--clay-500)">marigold-300<small>#FFDD75</small></div><div class="sw" style="background:var(--marigold-400);color:var(--clay-600)">marigold-400<small>#F2C948</small></div><div class="sw" style="background:var(--marigold-500);color:#fff">marigold-500<small>#D9A92C</small></div></div></div></body></html>
